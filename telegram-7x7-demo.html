<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جدول ۷×۷ پیام جدول</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:var(--tg-theme-text-color,#1f3040);background:var(--tg-theme-bg-color,#fff)}*{box-sizing:border-box}body{margin:0;padding:8px;max-width:500px;margin-inline:auto}h1{font-size:17px;margin:4px 0 8px}.board{width:min(100%,310px);margin:7px auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;direction:rtl}.cell{aspect-ratio:1;border:1px solid #b4c8d0;border-radius:4px;background:var(--tg-theme-secondary-bg-color,#f1f5f7);font-size:clamp(15px,5vw,20px);font-weight:bold;color:var(--tg-theme-text-color,#1f3040);position:relative;padding:0}.black{background:#2f3c49;border-color:#2f3c49;pointer-events:none}.word{background:#d6eaf4;color:#16334a}.active{background:#9bceee;outline:2px solid #1680bd;outline-offset:-2px;color:#12314b}.error{background:#f9a6aa;color:#4a1520}.num{position:absolute;top:1px;right:2px;font-size:8px;font-weight:normal}.clue{border:1px solid #c7d5df;border-radius:8px;padding:8px;background:var(--tg-theme-secondary-bg-color,#f4f8fa);min-height:58px}.clue b{font-size:12px}.clue p{margin:5px 0;font-size:13px}.row{display:flex;gap:5px;margin-top:7px}.row button,.row a{flex:1;font-size:11px;text-align:center;padding:7px 1px;border-radius:6px;background:var(--tg-theme-secondary-bg-color,#e9f0f4);color:var(--tg-theme-text-color,#203040);border:1px solid #bacbd5;text-decoration:none}.row .main{background:var(--tg-theme-button-color,#087eb8);color:var(--tg-theme-button-text-color,#fff);border:0}.kbd{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;margin:8px 0}.kbd button{font:700 15px Tahoma,Arial,sans-serif;min-width:0;height:28px;padding:0;border:1px solid #bdcad5;border-radius:4px;color:var(--tg-theme-text-color,#203040);background:var(--tg-theme-secondary-bg-color,#eef3f8)}#status{text-align:center;font-size:11px;min-height:17px;margin-top:5px}.sub{text-align:center;font-size:10px;color:var(--tg-theme-hint-color,#738190);margin:5px 0 1px;line-height:1.5}@media(min-width:420px){.kbd button{height:34px}.row button,.row a{font-size:12px}}.clue{border:2px solid #a2c4d4;border-right:4px solid #237ea0;background:var(--tg-theme-secondary-bg-color,#edf5f9);min-height:0;padding:8px 10px;line-height:1.5}.clue b{font-size:12px;font-weight:900}.clue p{font-size:14px;font-weight:800;margin:4px 0}.clue-top{margin:0 0 9px}.clue-bottom{margin:9px 0 0}</style></head><body>
<h1>🧩 پیام جدول | آزمایشی ۷×۷</h1><div class="clue clue-top" role="status" aria-live="polite"><b id="clueNoTop"></b><p id="clueTop"></p></div>
<div class="board" id="board"></div>
<div class="clue clue-bottom"><b id="clueNo"></b><p id="clue"></p></div>
<div class="row"><button id="prev">سؤال قبل</button><button id="next">سؤال بعد</button><button id="erase">پاک‌کن</button></div>
<div class="kbd" id="kbd"></div><div class="row"><button id="hint">راهنمایی</button><button class="main" id="check">بررسی پاسخ</button><a href="https://t.me/share/url?url=https%3A%2F%2Fnimania.github.io%2Fpayamejadval%2Ftelegram-7x7-demo.html">فرستادن در تلگرام</a></div>
<div id="status"></div><p class="sub">حرف‌ها را با صفحه‌کلید بالا وارد کن. روی تقاطع دوباره بزن تا جهت عوض شود.<br>پیشرفت روی همین دستگاه ذخیره می‌شود.</p>
<script>
const g=['###تولد','##با###','کتاب###','##کس###','###تازه','##پا###','زمین###'];
const e=[['افقی',1,0,3,'تولد','روز به دنیا آمدن'],['افقی',2,1,2,'با','حرف اضافه به معنی همراه'],['افقی',3,2,0,'کتاب','مجموعه‌ای از صفحه‌ها برای خواندن'],['افقی',4,3,2,'کس','شخص یا فرد'],['افقی',5,4,3,'تازه','نو؛ نقطه مقابل کهنه'],['افقی',6,5,2,'پا','عضوی از بدن برای راه رفتن'],['افقی',7,6,0,'زمین','سیاره‌ای که روی آن زندگی می‌کنیم'],['عمودی',1,0,3,'تابستان','فصل گرم سال'],['عمودی',2,1,2,'باک','مخزن سوخت خودرو'],['عمودی',6,5,2,'پی','رد و نشانه']];
const $=x=>document.getElementById(x),k='payamejadval-7x7-v1',idx=(r,c)=>r*7+c;
let v=Array(49).fill(''),s=0,p=0,bad=false,h=0;
try{let z=JSON.parse(localStorage.getItem(k)||'null');if(z&&z.v&&z.v.length===49){v=z.v;h=z.h||0}}catch(_){}
function cells(x){return Array.from(x[4],(_,i)=>idx(x[2]+(x[0]==='عمودی'?i:0),x[3]+(x[0]==='افقی'?i:0)))}
function save(){try{localStorage.setItem(k,JSON.stringify({v,h}))}catch(_){}}
function change(n){s=(n+e.length)%e.length;p=0;bad=false;draw()}
function choose(r,c){let id=idx(r,c),list=e.map((x,j)=>cells(x).includes(id)?j:-1).filter(x=>x>=0);if(!list.length)return;s=list.includes(s)?list[(list.indexOf(s)+1)%list.length]:list[0];p=cells(e[s]).indexOf(id);bad=false;draw()}
function draw(){let b=$('board'),current=cells(e[s]),start={};b.replaceChildren();e.forEach(x=>{let n=idx(x[2],x[3]);start[n]??=x[1]});let count=0,wrong=0,total=0;
g.forEach((row,r)=>Array.from(row).forEach((ch,c)=>{let id=idx(r,c),x=document.createElement('button');x.type='button';x.className='cell';if(ch==='#')x.className+=' black';else{total++;if(v[id])count++;if(bad&&v[id]&&v[id]!==ch){x.className+=' error';wrong++}else if(current.includes(id))x.className+=id===current[p]?' active':' word';x.textContent=v[id]||'';if(start[id]){let n=document.createElement('span');n.className='num';n.textContent=start[id];x.appendChild(n)}x.onclick=()=>choose(r,c)}b.appendChild(x)}));
let x=e[s],label=x[0]+' '+x[1]+' • '+Array.from(x[4]).length+' حرف';$('clueNo').textContent=label;$('clueNoTop').textContent=label;$('clue').textContent=x[5];$('clueTop').textContent=x[5];
let solved=v.every((ch,i)=>g[Math.floor(i/7)][i%7]==='#'||ch===g[Math.floor(i/7)][i%7]);
$('status').textContent=solved?'آفرین! جدول را درست حل کردی 🎉':bad?(wrong?wrong+' خانهٔ واردشده نادرست است.':'همهٔ حروف واردشده درست‌اند.'):'پیشرفت: '+count+' از '+total+' خانه • راهنمایی: '+h}
function put(ch){let a=cells(e[s]);v[a[p]]=ch;if(p<a.length-1)p++;bad=false;save();draw()}
function erase(){let a=cells(e[s]);if(!v[a[p]]&&p>0)p--;v[a[p]]='';bad=false;save();draw()}
$('prev').onclick=()=>change(s-1);$('next').onclick=()=>change(s+1);$('erase').onclick=erase;$('check').onclick=()=>{bad=true;draw()};
$('hint').onclick=()=>{let a=cells(e[s]),answer=Array.from(e[s][4]),i=a.findIndex((id,j)=>v[id]!==answer[j]);if(i<0){change(s+1);return}p=i;v[a[i]]=answer[i];h++;bad=false;save();draw()};
const alphabet='آ ا ب پ ت ث ج چ ح خ د ذ ر ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ه ی'.split(' ');alphabet.forEach(ch=>{let b=document.createElement('button');b.textContent=ch;b.onclick=()=>put(ch);$('kbd').appendChild(b)});
document.addEventListener('keydown',ev=>{if(ev.key==='Backspace'){erase();ev.preventDefault()}else if(alphabet.includes(ev.key))put(ev.key)});draw();
</script></body></html>
