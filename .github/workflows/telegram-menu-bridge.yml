name: Temporary Telegram crossword private menu bridge

on:
  # Polling schedule retired for Google Apps Script migration.
  # Manual workflow_dispatch retained as an emergency diagnostic.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payamejadval-temporary-telegram-poll
  cancel-in-progress: false

jobs:
  private-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify bot menu behavior
        run: node tests/test_telegram_menu.cjs
      - name: Check only @PayameJadvalBot private commands (skip when webhook exists)
        env:
          TELEGRAM_CROSSWORD_BOT_TOKEN: ${{ secrets.TELEGRAM_CROSSWORD_BOT_TOKEN }}
        run: node telegram/poll-telegram-menu.js
