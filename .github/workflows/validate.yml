name: Validate Payame Jadval
on:
  push:
    branches: [main]
    paths:
      - index.html
      - public-app.js
      - quality-gate.js
      - player.js
      - glossary.js
      - metrics.js
      - stats-page.js
      - stats.html
      - data/bank-stats.json
      - print-pdf.js
      - mini-image.js
      - sudoku.js
      - clue-in-cell.js
      - sudoku-player.js
      - data/daily-games.json
      - data/mini-puzzles.json
      - firebase-config.js
      - data/published.json
      - tests/**
      - .github/workflows/validate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public scripts and crossword reading order
        run: |
          node --check player.js
          node --check glossary.js
          node --check metrics.js
          node --check stats-page.js
          node --check print-pdf.js
          node --check mini-image.js
          node --check sudoku.js
          node --check clue-in-cell.js
          node --check public-app.js
          node --check quality-gate.js
          node --check firebase-config.js
          node tests/test_player.cjs
          node tests/test_glossary.cjs
          node tests/test_metrics.cjs
          node tests/test_print_pdf.cjs
          node tests/test_mini_image.cjs
          node tests/test_sudoku.cjs
          node tests/test_mini.cjs
          node tests/test_clue_in_cell.cjs
          node tests/test_public_quality.cjs
      - name: Ensure public archive never includes private database
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const d=JSON.parse(fs.readFileSync('data/published.json','utf8'));
          assert(Array.isArray(d.puzzles),'Static archive has a puzzles array');
          for(const p of d.puzzles){
            assert(p.id&&p.title&&p.puzzle?.version===3);
            assert(!Object.hasOwn(p,'bank')&&!Object.hasOwn(p,'entries'));
          }
          console.log('Static archive uses public puzzle records only.');
          NODE
