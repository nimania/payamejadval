name: Deploy Payame Jadval to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage only the approved public website
        run: |
          mkdir -p public/data public/assets
          cp assets/payamejadval-logo.webp assets/favicon.svg public/assets/
          cp index.html public/index.html
          cp public-app.js public/public-app.js
          cp player.js public/player.js
          cp sudoku.js public/sudoku.js
          cp sudoku-player.js public/sudoku-player.js
          cp metrics.js public/metrics.js
          cp stats-page.js public/stats-page.js
          cp stats.html public/stats.html
          cp data/bank-stats.json public/data/bank-stats.json
          cp glossary.js public/glossary.js
          cp print-pdf.js public/print-pdf.js
          cp mini-image.js public/mini-image.js
          cp quality-gate.js public/quality-gate.js
          cp firebase-config.js public/firebase-config.js
          cp data/published.json public/data/published.json
          cp data/daily-games.json public/data/daily-games.json
          cp data/mini-puzzles.json public/data/mini-puzzles.json
      - name: Refresh public crossword snapshot from Firestore (read only)
        run: |
          node scripts/snapshot-public-firestore.cjs public/data/published.json
      - name: Verify all published daily Sudoku games
        run: |
          node scripts/verify-daily-games.cjs
          node tests/test_mini.cjs
          node tests/test_mini_image.cjs
      - name: Check single-page A4 printable layouts using live approved puzzles
        run: |
          node scripts/verify-onepage-pdf.cjs public/data/published.json
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
