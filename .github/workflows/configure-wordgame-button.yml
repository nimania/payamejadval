name: Configure PayameJadval word game menu button
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-wordgame-button.yml'
  workflow_run:
    workflows: ['Deploy Payame Jadval to GitHub Pages']
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: payamejadval-configure-wordgame-button
  cancel-in-progress: false

jobs:
  configure:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_CROSSWORD_BOT_TOKEN: ${{ secrets.TELEGRAM_CROSSWORD_BOT_TOKEN }}
    steps:
      - name: Verify official word game and configure menu button for PayameJadvalBot only
        shell: python
        run: |
          import os, json, urllib.request
          token = os.environ.get("TELEGRAM_CROSSWORD_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("Dedicated bot secret is missing; no Telegram settings were changed.")
          game = "https://nimania.github.io/payamejadval/kalamechin-pro.html?v=20261111-rtl-mobile2"
          levels = "https://nimania.github.io/payamejadval/data/kalamechin-pro.json"
          # Wait for the corresponding Pages deployment instead of pointing Telegram at a 404.
          import time
          ready = False
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(game, timeout=12) as response:
                      webpage = response.read()
                      if response.status != 200 or b'kalamechin-pro.json' not in webpage:
                          raise RuntimeError("Professional game HTML is not published")
                  with urllib.request.urlopen(levels, timeout=12) as response:
                      data = json.load(response)
                      if response.status != 200 or data.get("schema") != 1 or len(data.get("levels", [])) < 20:
                          raise RuntimeError("Professional level data is not published")
                  ready = True
                  break
              except Exception:
                  time.sleep(10)
          if not ready:
              raise SystemExit("Professional game deployment did not pass verification. Telegram settings unchanged.")

          def api(method, body):
              request = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/" + method,
                  data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      payload = json.load(response)
              except Exception:
                  raise SystemExit("Telegram request failed; no private credentials were printed.") from None
              if not payload.get("ok"):
                  raise SystemExit("Telegram rejected " + method + ": " + str(payload.get("error_code", "unknown")))
              return payload["result"]

          bot = api("getMe", {})
          if str(bot.get("username", "")).lower() != "payamejadvalbot":
              raise SystemExit("Token identity mismatch. Refusing to change another bot.")
          button = {"type": "web_app", "text": "🔤 کلمه‌چین", "web_app": {"url": game}}
          api("setChatMenuButton", {"menu_button": button})
          current = api("getChatMenuButton", {})
          if current.get("type") != "web_app" or current.get("web_app", {}).get("url") != game:
              raise SystemExit("Telegram did not confirm menu button URL")
          print("SUCCESS: PayameJadvalBot default private-chat menu button launches Kalamechin.")
          print("Existing reply-keyboard games and Google Apps Script polling were not modified.")

      - name: Report verified Telegram button as commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context=telegram/kalamechin-menu \
            -f description="Telegram confirmed the word game button"
