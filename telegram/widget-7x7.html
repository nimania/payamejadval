<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیام جدول ۷×۷</title><style>
*{box-sizing:border-box}body{font:12px Tahoma,sans-serif;color:var(--tg-theme-text-color,#203040);margin:3px 5px}.head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 5px}.head b{font-size:14px}.board{display:grid;direction:rtl;grid-template-columns:repeat(7,1fr);gap:2px;width:252px;max-width:100%;margin:0 auto 5px}.cell{aspect-ratio:1;min-width:0;padding:0;border:1px solid #adbdc8;border-radius:3px;background:var(--tg-theme-secondary-bg-color,#edf2f6);color:var(--tg-theme-text-color,#203040);font:bold 17px Tahoma,sans-serif;position:relative}.black{background:#303e4b;border-color:#303e4b}.word{background:#d1e9f6;color:#223344}.sel{background:#8cccff;color:#11283d;outline:2px solid #1681be;outline-offset:-2px}.wrong{background:#f8a8a8;color:#54202a}.num{position:absolute;top:1px;right:2px;font-size:8px;font-weight:normal}.clue{padding:5px 7px;border:1px solid #bfcdd8;border-radius:6px;min-height:46px}.clue b{font-size:11px}.clue div{margin-top:3px;font-size:12px}.row{display:flex;gap:3px;margin-top:5px}.row button{min-width:0;flex:1;border:1px solid #bacad6;background:var(--tg-theme-secondary-bg-color,#edf2f6);color:var(--tg-theme-text-color,#203040);border-radius:5px;font:11px Tahoma,sans-serif;padding:5px 0}.row button.main{background:var(--tg-theme-button-color,#3390ec);color:var(--tg-theme-button-text-color,#fff);border:0}.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:6px}.keys button{min-width:0;height:25px;border:1px solid #b9c9d5;border-radius:4px;font: bold 13px Tahoma,sans-serif;color:var(--tg-theme-text-color,#203040);background:var(--tg-theme-secondary-bg-color,#edf2f6);padding:0}#stat{font-size:10px;text-align:center;margin-top:5px}
</style></head><body><div class="head"><b>🧩 پیام جدول ۷×۷</b><span>شمارهٔ آزمایشی ۱</span></div><div class="board" id="board"></div><div class="clue"><b id="id"></b><div id="clue"></div></div><div class="row"><button id="prev">قبلی</button><button id="next">بعدی</button><button id="erase">پاک‌کن</button></div><div class="keys" id="keys"></div><div class="row"><button id="hint">راهنمایی</button><button class="main" id="check">بررسی جواب</button></div><div id="stat"></div><script>
const G=['###تولد','##با###','کتاب###','##کس###','###تازه','##پا###','زمین###'];
const E=[['h',0,3,'تولد','روز به دنیا آمدن'],['h',1,2,'با','به معنی همراه'],['h',2,0,'کتاب','مجموعه‌ای از صفحه‌ها برای خواندن'],['h',3,2,'کس','شخص یا فرد'],['h',4,3,'تازه','نو؛ مقابل کهنه'],['h',5,2,'پا','عضو بدن برای راه رفتن'],['h',6,0,'زمین','سیاره محل زندگی ما'],['v',0,3,'تابستان','فصل گرم سال'],['v',1,2,'باک','مخزن سوخت خودرو'],['v',5,2,'پی','رد و نشانه']];
const $=n=>document.getElementById(n),I=(r,c)=>7*r+c;let V=Array(49).fill(''),s=0,p=0,bad=false,h=0;
try{let x=JSON.parse(localStorage.getItem('jadval7')||'null');if(x&&x.v.length===49){V=x.v;h=x.h||0}}catch(e){}
function save(){try{localStorage.setItem('jadval7',JSON.stringify({v:V,h:h}))}catch(e){}}
function cells(e){return Array.from(e[3],(_,j)=>I(e[1]+(e[0]==='v'?j:0),e[2]+(e[0]==='h'?j:0)))}
function move(j){s=(j+E.length)%E.length;p=0;bad=false;draw()}
function pick(r,c){let i=I(r,c),q=E.map((e,j)=>cells(e).includes(i)?j:-1).filter(x=>x>=0);if(!q.length)return;s=q.includes(s)?q[(q.indexOf(s)+1)%q.length]:q[0];p=cells(E[s]).indexOf(i);bad=false;draw()}
function draw(){let board=$('board'),a=cells(E[s]),num={},filled=0,total=0,errors=0;E.forEach((e,j)=>{let x=I(e[1],e[2]);num[x]=num[x]||j+1});board.replaceChildren();G.forEach((row,r)=>Array.from(row).forEach((ch,c)=>{let i=I(r,c),b=document.createElement('button');b.className='cell';if(ch==='#'){b.className+=' black';b.disabled=true}else{total++;if(V[i])filled++;if(bad&&V[i]&&V[i]!==ch){b.className+=' wrong';errors++}else if(a.includes(i))b.className+=a[p]===i?' sel':' word';b.textContent=V[i]||'';if(num[i]){let n=document.createElement('span');n.className='num';n.textContent=num[i];b.appendChild(n)}b.onclick=()=>pick(r,c)}board.appendChild(b)}));let e=E[s];$('id').textContent=(e[0]==='h'?'افقی ':'عمودی ')+(e[0]==='h'?s+1:s-6)+' • '+e[3].length+' حرف';$('clue').textContent=e[4];let ok=V.every((v,i)=>G[Math.floor(i/7)][i%7]==='#'||v===G[Math.floor(i/7)][i%7]);$('stat').textContent=ok?'آفرین! جدول را درست حل کردی 🎉':bad?(errors?'تعداد حروف نادرست: '+errors:'حروف واردشده درست‌اند'):'پیشرفت: '+filled+' از '+total+' خانه • راهنمایی: '+h}
function put(x){let a=cells(E[s]);V[a[p]]=x;if(p<a.length-1)p++;bad=false;save();draw()}
function erase(){let a=cells(E[s]);if(!V[a[p]]&&p>0)p--;V[a[p]]='';bad=false;save();draw()}
$('prev').onclick=()=>move(s-1);$('next').onclick=()=>move(s+1);$('erase').onclick=erase;$('check').onclick=()=>{bad=true;draw()};$('hint').onclick=()=>{let a=cells(E[s]),w=Array.from(E[s][3]),j=a.findIndex((x,i)=>V[x]!==w[i]);if(j<0){move(s+1);return}p=j;V[a[j]]=w[j];h++;bad=false;save();draw()};'آ ا ب پ ت ث ج چ ح خ د ذ ر ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ه ی'.split(' ').forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>put(c);$('keys').appendChild(b)});draw();
</script></body></html>
