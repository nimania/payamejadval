<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:3px 6px;color:var(--tg-theme-text-color,#26323f);font:12px Tahoma,sans-serif}h3{font-size:14px;margin:3px 0 6px}.board{width:100%;max-width:310px;display:grid;grid-template-columns:18px repeat(7,minmax(0,1fr));gap:2px;direction:rtl;margin:0 auto}.axis{display:flex;align-items:center;justify-content:center;font:11px Tahoma,sans-serif;color:var(--tg-theme-hint-color,#75818f)}button{font:inherit;cursor:pointer}.cell{aspect-ratio:1;min-width:0;padding:0;position:relative;background:var(--tg-theme-secondary-bg-color,#f4f7f9);border:1px solid #c2ced5;border-radius:3px;color:var(--tg-theme-text-color,#253847);font-weight:700;font-size:17px}.red{background:#bd0b1b;border:1px solid #bd0b1b;pointer-events:none}.word{background:#d8eefa;color:#203a4e}.focus{background:#a7d7f6;outline:2px solid #2a7dab;outline-offset:-2px;color:#17344d}.error{background:#ffd6d6;color:#892333}.clue{border:1px solid #ccd7df;background:var(--tg-theme-secondary-bg-color,#f5f8fa);border-radius:6px;padding:7px;margin:7px 0;min-height:44px}.clue b{font-size:11px}.clue p{margin:3px 0 0;font-size:12px}.tools{display:flex;gap:4px;margin:5px 0}.tools button{min-width:0;flex:1;font-size:11px;padding:5px 2px;background:var(--tg-theme-secondary-bg-color,#edf4f8);color:var(--tg-theme-text-color,#273847);border:1px solid #cad6de;border-radius:5px}.tools button.main{background:var(--tg-theme-button-color,#217abd);color:var(--tg-theme-button-text-color,#fff);border:0}.kbd{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin-top:7px}.kbd button{min-width:0;height:26px;padding:0;border:1px solid #c5d1da;border-radius:4px;background:var(--tg-theme-secondary-bg-color,#f4f7f9);color:var(--tg-theme-text-color,#253947);font-size:13px;font-weight:700}#progress{text-align:center;font-size:11px;min-height:18px;padding:3px}
</style><body><h3>🧩 پیام جدول | ۷×۷</h3><div id="board" class="board"></div><div class="clue"><b id="clabel"></b><p id="ctext"></p></div><div class="tools"><button id="prev">قبل</button><button id="next">بعد</button><button id="del">پاک‌کردن</button></div><div id="kbd" class="kbd"></div><div class="tools"><button id="hint">راهنمایی</button><button class="main" id="check">بررسی پاسخ</button></div><div id="progress"></div>
<script>
const G=["بآ##بمب","اب#مهوت","بازحا##","ادیدناک","##اوهیب","زارد#زا","روت##دب"],C={"horizontal":{"1":["وسیله‌ای انفجاری که از مواد و چاشنی تشکیل می‌شود","مایع ضروری برای زندگی"],"2":["پندار یا ادراک دور از واقعیت","حرف اضافه به معنی «همراهِ»"],"3":["جمع «حزب»؛ گروه‌های سیاسی"],"4":["نامزد یک انتخابات یا مسئولیت"],"5":["ناگهانی و بدون مقدمه"],"6":["حرف اضافه برای بیان مبدأ","بلند و کشیده از نظر طول"],"7":["برخلاف خوب","سفر یا گردش برنامه‌ریزی‌شدهٔ گروهی"]},"vertical":{"1":["پیکره‌ای که در گذشته پرستش می‌شد","خوراک گوشتی که روی آتش پخته می‌شود"],"2":["رشته‌ای که بر سر رشد می‌کند","واژه‌ای کهن برای خداوند"],"3":["عذر یا دستاویزی برای توجیه یک کار"],"4":["دارای حد و مرز مشخص"],"5":["دیدار از مکانی مقدس با نیت معنوی"],"6":["پررونق و ساخته‌وپرداخته، مقابل ویران","ضمیر سوم‌شخص مفرد"],"7":["پدر در گفتار خودمانی","طلا در زبان ادبی"]}},N=7,$=x=>document.getElementById(x),entries=[],pos=(r,c)=>7*r+c;
for(const dir of ['horizontal','vertical'])for(let i=0;i<N;i++){let run=[],j=0;
for(;j<=N;j++){let r=dir==='horizontal'?i:j,c=dir==='horizontal'?6-j:6-i,blocked=j===N||G[r][c]==='#';if(blocked){if(run.length){let group=i+1,part=entries.filter(e=>e.dir===dir&&e.group===group).length;
entries.push({dir,group,part,cells:run,word:run.map(([y,x])=>G[y][x]).join(''),clue:C[dir][String(group)][part]});run=[]}}else run.push([r,c]);}}
let values=Array(49).fill(''),selected=0,offset=0,checked=false,hints=0;
try{let x=JSON.parse(localStorage.getItem('jadval7-magazine')||'null');if(x&&x.values&&x.values.length===49){values=x.values;hints=x.hints||0}}catch(e){}
function save(){try{localStorage.setItem('jadval7-magazine',JSON.stringify({values,hints}))}catch(e){}}
function ids(e){return e.cells.map(([r,c])=>pos(r,c))}
function go(n){selected=(n+entries.length)%entries.length;offset=0;checked=false;draw()}
function pick(r,c){let k=pos(r,c),a=entries.map((e,i)=>ids(e).includes(k)?i:-1).filter(i=>i>=0);if(!a.length)return;selected=a.includes(selected)?a[(a.indexOf(selected)+1)%a.length]:a[0];offset=ids(entries[selected]).indexOf(k);checked=false;draw()}
function draw(){let board=$('board'),active=ids(entries[selected]),white=0,filled=0,wrong=0;board.replaceChildren();
let corner=document.createElement('span');board.append(corner);for(let col=1;col<=7;col++){let b=document.createElement('div');b.className='axis';b.textContent=col;board.append(b)}
for(let r=0;r<N;r++){let a=document.createElement('div');a.className='axis';a.textContent=r+1;board.append(a);
for(let c=6;c>=0;c--){let id=pos(r,c),b=document.createElement('button');b.className='cell';b.type='button';if(G[r][c]==='#'){b.className+=' red';b.disabled=true;}else{white++;if(values[id]){filled++;if(checked&&values[id]!==G[r][c]){b.className+=' error';wrong++;}}
if(active.includes(id))b.className+=active[offset]===id?' focus':' word';b.textContent=values[id]||'';b.onclick=()=>pick(r,c);}board.append(b)}}
let e=entries[selected],part=entries.filter(x=>x.dir===e.dir&&x.group===e.group).length>1?' ('+(e.part+1)+')':'';
$('clabel').textContent=(e.dir==='horizontal'?'افقی ':'عمودی ')+e.group+part+' • '+e.word.length+' حرف';$('ctext').textContent=e.clue;
let solved=values.every((v,i)=>G[Math.floor(i/7)][i%7]==='#'||v===G[Math.floor(i/7)][i%7]);
$('progress').textContent=solved?'آفرین! جدول کامل شد 🎉':checked?(wrong?wrong+' حرف نادرست وارد شده':'تا اینجا حروف واردشده درست‌اند'):'خانه‌های پر: '+filled+' از '+white+' • راهنمایی: '+hints;}
function type(ch){let a=ids(entries[selected]);values[a[offset]]=ch;if(offset<a.length-1)offset++;checked=false;save();draw()}
function del(){let a=ids(entries[selected]);if(!values[a[offset]]&&offset>0)offset--;values[a[offset]]='';checked=false;save();draw()}
$('prev').onclick=()=>go(selected-1);$('next').onclick=()=>go(selected+1);$('del').onclick=del;$('check').onclick=()=>{checked=true;draw()};
$('hint').onclick=()=>{let e=entries[selected],a=ids(e),i=a.findIndex((x,j)=>values[x]!==e.word[j]);if(i<0){go(selected+1);return;}offset=i;values[a[i]]=e.word[i];hints++;checked=false;save();draw()};
'آ ا ب پ ت ث ج چ ح خ د ذ ر ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ه ی'.split(' ').forEach(ch=>{let b=document.createElement('button');b.textContent=ch;b.onclick=()=>type(ch);$('kbd').append(b)});
draw();
</script></body></html>
