<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f3">
<meta name="description" content="جدول‌های کلمات متقاطع فارسی؛ حل آنلاین، بررسی پاسخ‌ها و ذخیرهٔ پیشرفت">
<title>پیام جدول | بازی آنلاین جدول کلمات متقاطع فارسی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{font-family:Vazirmatn,Tahoma,Arial,sans-serif;color:#1e2c38;background:#f5f5f3}
*{box-sizing:border-box}
body{margin:0}button,input{font:inherit}
button{cursor:pointer}a{color:#17628d;text-decoration:none}
header{background:#fff;border-bottom:1px solid #e2e5e9}
nav,main,footer{max-width:1140px;margin:auto;padding:18px 24px}
nav{display:flex;justify-content:space-between;align-items:center;gap:14px}
.brand{font-size:23px;font-weight:800;color:#223444}
.tag{background:#f0f4f7;border-radius:50px;padding:6px 15px;color:#567083;font-size:12px}
.intro{padding:24px 0 10px}h1{font-size:clamp(24px,4vw,36px);margin:0 0 10px}h2{font-size:19px;margin:0 0 10px}
p{line-height:1.9}.muted{color:#627282}.small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:18px;margin-top:20px}
.card,.empty,.game-frame{background:white;border:1px solid #e2e6ea;border-radius:17px;box-shadow:0 2px 10px #0b1f3608}
.card{padding:23px}.card h2{font-size:18px}.card .link{display:inline-block;margin-top:12px;font-weight:700}
.empty{padding:45px 20px;text-align:center;border-style:dashed}
.hidden{display:none!important}
#archiveStatus{font-size:13px;min-height:20px}
.play-nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:14px 0}
.link{font-weight:700}
.game-frame{padding:20px}
.play-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.action-button,.direction-button{border:1px solid #cbd8e2;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:700;color:#28445a;background:#fff}
.direction-button.active{color:white;background:#156482;border-color:#156482}
.action-button:not(.secondary){background:#1d5d7a;color:#fff;border-color:#1d5d7a}
button:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ff9b32;outline-offset:2px}
.play-progress{font-size:13px;color:#546778;margin:10px 0}
.play-message{font-size:13px;min-height:20px;color:#315f6f;font-weight:600}
.board{display:grid;direction:rtl;gap:1px;padding:3px;border-radius:10px;background:#c8d3dd;width:min(100%,690px);margin:18px auto;user-select:none}
.axis,.cell{aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(9px,1.5vw,14px);font-weight:700}
.axis{background:#ecf0f4;color:#31516b}
.cell{background:#fff;border:1px solid #dce2e7}
.cell.block{background:#bd0b1b;border-color:#bd0b1b}
.cell.selected{background:#e2f2fb;border-color:#70a1bd}
.cell.correct{background:#dff5e7;border-color:#74b28a}
.cell.incorrect{background:#ffe0df;border-color:#e68683}
.entry{width:100%;height:100%;min-width:0;padding:0;border:0;background:transparent;text-align:center;font-weight:700;color:#1a354a;outline-offset:-2px}
.entry:disabled{color:#165e7d}
.selected-hint{border-right:3px solid #d29a42;padding:8px 12px;margin:14px 0;background:#fff9f0;border-radius:6px;font-size:13px;line-height:2}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:23px}
.clue-section{min-width:0}.clue-section h2{margin:0 0 12px}
.clue-list{list-style:none;margin:0;padding:0}
.clue-line{margin:4px 0}
.clue-select{display:block;text-align:right;direction:rtl;width:100%;border:1px solid transparent;border-radius:8px;padding:8px 10px;line-height:1.9;background:transparent;color:#304557;font-size:13px}
.clue-select:hover{background:#f0f5f8}
.clue-line.selected .clue-select{border-color:#b4d4e4;background:#ecf6fb;color:#153e60;font-weight:700}
footer{margin-top:40px;border-top:1px solid #e1e5e7;color:#77838d;font-size:12px}
@media(max-width:700px){
 nav,main,footer{padding:15px}.clues{grid-template-columns:1fr}
 .game-frame{padding:10px}.play-toolbar{gap:6px}.action-button,.direction-button{padding:8px 10px;font-size:12px}
 .axis,.cell{font-size:clamp(8px,2.5vw,12px)}
}
</style></head>
<body>
<header><nav><a class="brand" href="./">پیام جدول</a><span class="tag">جدول کلمات متقاطع فارسی</span></nav></header>
<main>
<section class="intro"><h1 id="title">جدول‌های تازه، هر بار چالشی نو</h1>
<p id="subtitle" class="muted">مجموعهٔ جدول‌های طراحی‌شده و تأییدشده</p>
<p id="archiveStatus" class="muted" role="status"></p></section>
<section id="catalog" class="grid"></section>
<section id="empty" class="empty hidden"><h2>هنوز جدولی منتشر نشده است</h2><p class="muted">پس از تأیید و انتشار نخستین جدول در کارگاه طراحی، اینجا نمایش داده می‌شود.</p></section>
<section id="player" class="hidden"></section>
</main>
<footer>پیام جدول — محل بازی آنلاین جدول‌های تأییدشده</footer>
<script src="./firebase-config.js"></script>
<script src="./player.js"></script>
<script src="./quality-gate.js"></script>
<script src="./public-app.js"></script>
</body></html>
